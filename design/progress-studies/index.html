@font-face{font-family:Literata;src:url('../../assets/fonts/literata/Literata-Variable.ttf')}*{box-sizing:border-box}body{margin:0;background:#eeede9;color:#242621;font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;--paper:#faf9f5;--ink:#30352b;--muted:#73766c;--line:#dadbd2;--accent:#93b259;--wash:#e4ead8;--shadow:#c8c9bf}body.dark{background:#191b18;color:#e4e6de;--paper:#272a24;--ink:#e1e5d9;--muted:#a7ad9e;--line:#4a5043;--wash:#3f4b32;--shadow:#141710}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:5px}header{max-width:1100px;margin:auto;padding:40px 32px 28px;display:flex;align-items:center;justify-content:space-between}.brand{font-family:Literata,serif;font-size:22px}.brand small{font:11px sans-serif;letter-spacing:2px;margin-left:18px;color:var(--muted)}.theme{border:1px solid var(--line);background:var(--paper);padding:12px 18px;border-radius:24px}main{max-width:1100px;margin:auto;padding:8px 32px 64px}h1{font-size:36px;font-weight:500;letter-spacing:2px;margin:10px 0 12px}.intro{color:var(--muted);line-height:1.9;margin-bottom:38px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:48px}.label{display:flex;align-items:center;gap:12px;margin-bottom:18px}.label span{font:italic 25px Literata;color:var(--muted)}.label h2{font-size:18px;font-weight:500;margin:0}.label small{margin-left:auto;color:var(--muted);font-size:11px;letter-spacing:1px}.phone{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:28px;padding:24px 30px 20px;overflow:hidden;position:relative}.top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.top svg{width:22px;height:22px}svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;width:24px;height:24px}.excerpt{margin:34px 0 24px;padding:0 8px}.chapter{font-size:10px;letter-spacing:2px;color:var(--muted)}.excerpt h3{font:26px Literata,serif;margin:10px 0 20px}.excerpt p{font:15px/1.95 Literata,serif;margin:0;color:var(--muted)}.excerpt mark{background:var(--wash);color:var(--ink);border-radius:3px;padding:1px 0}.bookmeta{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:20px;margin-bottom:16px}.bookmeta strong{font-weight:500;font-size:17px}.bookmeta small{display:block;margin-top:6px;color:var(--muted);font-size:12px}.page-hint{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;letter-spacing:.3px}.seek{height:48px;position:relative;--p:37%}.seek input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;z-index:4}.seek:focus-within{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}.rail{position:absolute;left:0;right:0;top:24px;height:2px;border-radius:4px;background:var(--line)}.fill{position:absolute;height:100%;width:var(--p);background:var(--accent);border-radius:4px}.thumb{position:absolute;left:var(--p);top:9px;transform:translateX(-50%);width:18px;height:29px;background:var(--paper);color:var(--ink);filter:drop-shadow(0 2px 1px #0000000a)}.thumb svg{width:18px;height:29px;stroke-width:1.7}.time{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.controls{display:flex;justify-content:space-around;align-items:center;margin:24px 0 14px}.controls button{display:grid;place-items:center;min-width:44px;height:48px;border:0;background:transparent}.controls .play{border:1.5px solid var(--ink);border-radius:50%;width:58px;height:58px}.controls .skip{position:relative}.skip small{position:absolute;font-size:9px;top:22px}.skip svg{width:29px;height:29px}.bottom{display:flex;justify-content:space-between;color:var(--muted);padding:16px 8px 4px}.bottom span{display:flex;gap:6px;align-items:center;font-size:11px}.bottom svg{width:19px;height:19px}.notes{color:var(--muted);line-height:1.9;margin:20px 4px 0}.notes strong{color:var(--ink);font-weight:500}.sheet{position:relative;margin:0 0 10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px 16px 12px;box-shadow:0 4px 0 -1px var(--paper),0 4px 0 0 var(--line),0 8px 0 -1px var(--paper),0 8px 0 0 var(--line)}.sheet .seek{height:44px}.sheet .rail{top:22px;height:6px;background:var(--line);border:1px solid var(--line)}.sheet .fill{background:var(--wash);border-right:0}.sheet .thumb{top:12px;width:12px;height:23px;border:1.5px solid var(--ink);border-radius:5px;background:var(--paper)}.sheet .thumb:after{content:'';position:absolute;left:4px;top:6px;width:1px;height:8px;border-radius:1px;background:var(--ink)}.ticks{position:absolute;inset:0;display:flex;justify-content:space-evenly;pointer-events:none}.ticks i{height:4px;width:1px;background:var(--paper)}.footer{margin-top:38px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.8}.phone button:active{transform:scale(.96)}@media(max-width:760px){header{padding:24px 20px}.brand small{display:none}main{padding:4px 20px 40px}.grid{grid-template-columns:1fr;gap:34px}h1{font-size:28px}.phone{max-width:440px;margin:auto;padding:24px}.intro{margin-bottom:26px}.label{max-width:440px;margin:0 auto 18px}}
</style><header><div class="brand">lumina<small>INTERACTION STUDIES / 02</small></div><button class="theme" aria-pressed="false">切换深色</button></header><main><h1>纸页上的时间</h1><p class="intro">让进度像阅读留下的痕迹。两种圆角描边，两种纸页触感。<br>拖动进度条，或点击播放，感受位置变化。</p><div class="grid"></div><div class="footer">设计共性：1.6px 圆端描边 · 鼠尾草绿 #93B259 · 纸白底色 · ≥ 44px 交互热区<br>此处为章节播放进度的交互样稿，时间为演示数据；缓存与字幕覆盖状态需在选定方向后接入。</div></main><script>
const icons={book:'<path d="M12 5c-3-2-7-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-2-1-6-1-9 1v15"/>',heart:'<path d="M12 20S3 14 3 8a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6-9 12-9 12Z"/>',play:'<path d="M7 5c0-1 1-2 2-1l11 7c1 .5 1 1.5 0 2L9 20c-1 1-2 0-2-1Z"/>',pause:'<path d="M8 5v14M16 5v14"/>',back:'<path d="M7 5a9 9 0 1 1-4 9M7 1v5H2"/>',next:'<path d="M17 5a9 9 0 1 0 4 9M17 1v5h5"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.1M3 12h.1M3 18h.1"/>',timer:'<circle cx="12" cy="13" r="8"/><path d="M12 8v5l3 2M9 2h6"/>',down:'<path d="m5 9 7 6 7-6"/>',more:'<path d="M5 12h.1M12 12h.1M19 12h.1"/>'};const svg=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]}</svg>`;
for(let i=0;i<2;i++){const el=document.createElement('section');el.innerHTML=`<div class="label"><span>0${i+1}</span><h2>${i?'层叠书页':'页边书签'}</h2><small>${i?'PAPER EDGE':'MARGIN MARK'}</small></div><article class="phone"><div class="top">${svg('down')}<span>正在阅读 · 第 7 章</span>${svg('more')}</div><div class="excerpt"><div class="chapter">CHAPTER SEVEN</div><h3>The little prince</h3><p>“If someone loves a flower, of which just one single blossom grows in all the millions and millions of stars, <mark>it is enough to make him happy just to look at the stars.</mark>”</p></div><div class="bookmeta"><div><strong>小王子</strong><small>安托万·德·圣埃克苏佩里</small></div>${svg('heart')}</div><div class="${i?'sheet':'bookmark'}"><div class="page-hint"><span>${i?'本章 · 阅读进度':'CH. 07 / 27'}</span><span class="percent">37%</span></div><div class="seek"><div class="rail"><div class="fill"></div>${i?'<div class="ticks"><i></i><i></i><i></i><i></i><i></i><i></i></div>':''}</div><div class="thumb">${i?'':'<svg viewBox="0 0 18 29"><path d="M4 2h10a2 2 0 0 1 2 2v22l-7-5-7 5V4a2 2 0 0 1 2-2Z"/></svg>'}</div><input aria-label="${i?'层叠书页':'页边书签'}章节进度" type="range" min="0" max="1000" value="370"></div><div class="time"><span class="elapsed">08:24</span><span class="remaining">−14:18</span></div></div><div class="controls"><button data-step="-10" class="skip" aria-label="后退10秒">${svg('back')}<small>10</small></button><button class="play" aria-label="播放演示" aria-pressed="false">${svg('play')}</button><button data-step="30" class="skip" aria-label="前进30秒">${svg('next')}<small>30</small></button></div><div class="bottom"><span>${svg('book')} 原文</span><span>${svg('timer')} 定时</span><span>${svg('list')} 目录</span></div></article><p class="notes"><strong>${i?'像翻过的纸，留下一点厚度。':'像夹在页边的一枚书签。'}</strong><br>${i?'三层细线勾勒纸张边缘，窄小的圆角手柄沿纸槽移动。适合强化书籍质感。':'细线承载时间，空心书签标记当前位置。留白更多，适合融入现有播放页。'}</p>`;document.querySelector('.grid').append(el);let playing=false;const input=el.querySelector('input'),btn=el.querySelector('.play');const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;const update=()=>{const v=+input.value,sec=Math.round(v/1000*1362);el.querySelector('.seek').style.setProperty('--p',`${v/10}%`);el.querySelector('.percent').textContent=`${Math.round(v/10)}%`;el.querySelector('.elapsed').textContent=fmt(sec);el.querySelector('.remaining').textContent='−'+fmt(1362-sec);input.setAttribute('aria-valuetext',`${fmt(sec)}，共22分42秒`)};function state(){btn.innerHTML=svg(playing?'pause':'play');btn.setAttribute('aria-pressed',playing);btn.setAttribute('aria-label',playing?'暂停演示':'播放演示')}input.addEventListener('input',update);btn.onclick=()=>{if(+input.value===1000)input.value=0;playing=!playing;state();update()};el.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{input.value=Math.min(1000,Math.max(0,+input.value+Number(b.dataset.step)/1362*1000));update()});setInterval(()=>{if(playing){input.value=Math.min(1000,+input.value+1);update();if(+input.value===1000){playing=false;state()}}},1362);update()}
document.querySelector('.theme').onclick=function(){const dark=document.body.classList.toggle('dark');this.textContent=dark?'切换浅色':'切换深色';this.setAttribute('aria-pressed',dark)};
</script></html>
