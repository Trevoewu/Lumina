<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumina · 手绘进度条</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f2ed;color:#34382e;font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{max-width:880px;margin:auto;padding:64px 28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:23px;font-weight:500;margin:0}p{color:#777b70;line-height:1.8;font-size:13px}a{color:inherit;text-underline-offset:5px;font-size:12px}.paper{margin:40px 0 24px;background:#fcfbf7;border:1px solid #e2e1d8;border-radius:8px;padding:92px 48px;box-shadow:0 2px 0 #e7e6de;position:relative}.paper:before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.16;border-radius:inherit;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23928a75' filter='url(%23n)' opacity='.28' d='M0 0h180v180H0z'/%3E%3C/svg%3E")}.slider{position:relative;height:48px;width:100%;--p:42%;touch-action:pan-y}.rail{width:100%;height:48px;position:absolute;overflow:visible;fill:none;stroke-linecap:round;stroke-linejoin:round}.pencil{stroke:#c6c7bc;stroke-width:1.65}.ink{stroke:#859e55;stroke-width:2.15}.echo{stroke:#859e55;stroke-width:.65;opacity:.4}.handle{position:absolute;left:var(--p);top:50%;width:28px;height:34px;transform:translate(-50%,-50%) rotate(-5deg);filter:drop-shadow(1px 2px 1px #39372214);pointer-events:none}.handle svg{width:100%;height:100%;overflow:visible;stroke:#444c37;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;fill:#fcfbf7}.slider:active .handle{transform:translate(-50%,-50%) rotate(-2deg)}input{position:absolute;inset:0;width:100%;height:48px;margin:0;opacity:0;cursor:ew-resize}.slider:has(input:focus-visible){outline:2px solid #93b259;outline-offset:8px;border-radius:6px}.caption{display:flex;justify-content:space-between;gap:20px;color:#777b70;font-size:12px;line-height:1.8}@media(max-width:540px){main{padding:36px 22px}.paper{padding:78px 26px}.caption{display:block}.caption span{display:block;margin-bottom:8px}h1{font-size:20px}}
</style>
<main><header><h1>03 · 铅笔与纸片</h1><a href="./">前两个版本</a></header><p>手绘进度条 / 拖动滑块</p><div class="paper"><div class="slider"><svg class="rail" viewBox="0 0 600 48" preserveAspectRatio="none" aria-hidden="true"><defs><clipPath id="played"><rect id="clip" x="-3" y="0" width="255" height="48"/></clipPath></defs><path class="pencil" d="M0 25 C49 23.5 73 26 118 24.8 S197 23.5 251 24.6 S327 25.6 371 24.2 S453 25.5 493 24.5 S562 24 600 25"/><g clip-path="url(#played)"><path class="ink" d="M0 25 C49 23.5 73 26 118 24.8 S197 23.5 251 24.6 S327 25.6 371 24.2 S453 25.5 493 24.5 S562 24 600 25"/><path class="echo" d="M0 26.5 Q70 24.9 118 26 Q189 24.6 251 26 Q334 25 371 25.7 Q448 26.3 493 26 Q553 24.9 600 26.5"/></g></svg><div class="handle"><svg viewBox="0 0 28 34" aria-hidden="true"><path d="M7 3.5 Q14 2.4 22 4 L23 25 Q22.8 29 19 29.5 L6 28.8 Q3.5 28.5 4 25 L4.5 7 Q4.4 4 7 3.5Z"/><path d="m17 3.5-.2 6.2 5.6-.5" fill="none" stroke-width="1.2"/><path d="m10 14-.3 8m4.3-8-.2 7" fill="none" stroke-width="1.3"/></svg></div><input type="range" min="0" max="100" step="0.1" value="42" aria-label="手绘播放进度" aria-valuetext="42%"></div></div><div class="caption"><span>进度条 · 微弧铅笔线，鼠尾草绿标记已播放</span><span>滑块 · 圆角纸片，折角与双线握纹</span></div></main>
<script>const range=document.querySelector('input');range.addEventListener('input',()=>{document.querySelector('.slider').style.setProperty('--p',range.value+'%');document.querySelector('#clip').setAttribute('width',Number(range.value)*6+3);range.setAttribute('aria-valuetext',Math.round(range.value)+'%')});</script></html>
